# ═══ 更新日志 ═══
# 2026-09-25：明确此文件仅供历史双容器回滚，避免公开发布后被误用为当前单容器入口。
# 2026-09-18：发布镜像同样给网关 3 分钟停机宽限，保留在途 RPC 收尾和状态落盘时间。
# 仅供历史双容器部署回滚；不用于当前 v2.4.0 单容器安装或升级。
# 当前部署使用 docker-compose.yml，按 README 和 docs/panel.md 准备目录及验证。
#
# 回滚前先停止新部署，并把下方 :latest 改为维护记录中已核验的旧镜像版本或摘要。
# 此文件沿用旧配置挂载、独立面板端口和 Docker socket，必须配套对应历史配置及备份。
# 不要让旧、新部署同时写入相同数据目录，也不要将旧 latest 标签视作已验证的回滚版本。
services:
  wb2api:
    image: ghcr.io/dddmiku/workbuddy2api:latest
    container_name: workbuddy2api
    restart: unless-stopped
    stop_grace_period: 3m
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      - ./config.json:/app/config.json:ro

  wb2api-admin:
    image: ghcr.io/dddmiku/workbuddy2api-panel:latest
    container_name: wb2api-admin
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - WB2API_GATEWAY_DIR=/gateway
      - WB2API_ADMIN_DIR=/data
      - WB2API_ADMIN_HOST=0.0.0.0
      - WB2API_GATEWAY_URL=http://wb2api:7863
      - WB2API_CONTAINER=workbuddy2api
    ports:
      - "127.0.0.1:7864:7864"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/gateway
      - ./panel-data:/data
    depends_on:
      - wb2api

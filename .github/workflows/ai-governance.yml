# ═══ 更新日志 ═══
# 2026-09-25：取消issue/PR自动外发，外发与条目修改分别显式选择；仅私有维护库可用且不检出目标PR代码。
name: 手动 ai 治理（会外发并修改 issue/PR，默认关闭）

on:
  workflow_dispatch:
    inputs:
      allow_external_ai:
        description: '允许向配置的外部ai发送指定条目及仓库相关上下文'
        type: boolean
        required: true
        default: false
      allow_github_mutations:
        description: '允许旧治理流程分类、评论、修改或关闭所选条目；dry-run不覆盖所有分支'
        type: boolean
        required: true
        default: false
      target_type:
        description: '人工选择处理类型'
        type: choice
        options: [issue, pull_request]
        default: issue
      target_number:
        description: '要处理的已有 issue 或 PR 编号'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  governance:
    if: github.repository == 'dddmiku/workbuddy2api-maintenance' && github.event.repository.private == true && inputs.allow_external_ai == true && inputs.allow_github_mutations == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      models: read
    steps:
      - name: Verify opt-in target and current private visibility
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TYPE: ${{ inputs.target_type }}
          TARGET_NUMBER: ${{ inputs.target_number }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = 'dddmiku/workbuddy2api-maintenance'
          test "$(gh api --hostname github.com "repos/$GITHUB_REPOSITORY" --jq '.private')" = 'true'
          [[ "$TARGET_NUMBER" =~ ^[1-9][0-9]*$ ]]
          case "$TARGET_TYPE" in
            issue) endpoint=issues; event_name=issues; payload_field=issue ;;
            pull_request) endpoint=pulls; event_name=pull_request_target; payload_field=pull_request ;;
            *) exit 1 ;;
          esac
          gh api --hostname github.com "repos/$GITHUB_REPOSITORY/$endpoint/$TARGET_NUMBER" > "$RUNNER_TEMP/governance-item.json"
          jq --arg field "$payload_field" '{action: "opened", ($field): .}' "$RUNNER_TEMP/governance-item.json" > "$RUNNER_TEMP/governance-event.json"
          printf '%s\n' "$event_name" > "$RUNNER_TEMP/governance-event-name"

      - name: Check out trusted default-branch action code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked action dependencies without lifecycle scripts
        working-directory: .github/actions/ai-governance
        run: npm ci --omit=dev --ignore-scripts

      - name: Send selected content to ai and run explicitly permitted governance
        working-directory: .github/actions/ai-governance
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          INPUT_AI_API_KEY: ${{ secrets.AI_API_KEY }}
          INPUT_AI_MODEL: ${{ secrets.AI_MODEL }}
          INPUT_LABELS: 'bug,enhancement,question,documentation'
          INPUT_LANGUAGE: 'zh-CN'
          INPUT_DRY_RUN: 'true'
          INPUT_MAINTAINER_EXEMPT: 'true'
          INPUT_ENABLE_PR_GOVERNANCE: 'true'
          INPUT_MAX_CANONICAL_INDEX: '50'
          INPUT_ANALYZE_FILE_CHANGES: 'false'
        run: |
          set -euo pipefail
          # Existing handlers consume an opened-item payload. This process-only
          # adapter runs solely after the explicit manual opt-in above.
          event_name="$(cat "$RUNNER_TEMP/governance-event-name")"
          GITHUB_EVENT_NAME="$event_name" GITHUB_EVENT_PATH="$RUNNER_TEMP/governance-event.json" node src/index.js

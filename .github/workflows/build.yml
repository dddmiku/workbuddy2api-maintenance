# ═══ 更新日志 ═══
# 2026-09-25：仅在已核验私有维护仓库手动或版本tag校验并生成完整运行包，移除定时公开镜像及自动Release发布。
name: Private runtime build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: private-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  verify:
    name: Verify private source and embedded panel
    if: github.repository == 'dddmiku/workbuddy2api-maintenance' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify current repository visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dddmiku/workbuddy2api-maintenance'
          test "$(gh api --hostname github.com "repos/$GITHUB_REPOSITORY" --jq '.private')" = 'true'

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify committed dependencies
        run: go mod verify

      - name: Test and vet Go packages
        run: |
          go test ./... -count=1
          go vet ./...
          go test -race ./... -count=1

      - name: Verify embedded panel matches its source
        run: |
          python3 panel/build.py
          git diff --exit-code -- panel/index.html

      - name: Test panel and runtime scripts
        run: |
          python3 -m unittest discover -s panel -p 'test_*.py' -v
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

  runtime:
    name: Build both private runtime bundles
    needs: verify
    if: github.repository == 'dddmiku/workbuddy2api-maintenance' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify current repository visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dddmiku/workbuddy2api-maintenance'
          test "$(gh api --hostname github.com "repos/$GITHUB_REPOSITORY" --jq '.private')" = 'true'

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build fixed runtime contents
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA:0:12}"
          fi
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X workbuddy2api/internal/version.Version=$version -X workbuddy2api/internal/version.Commit=$GITHUB_SHA -X workbuddy2api/internal/version.BuiltAt=$built_at"
          mkdir -p dist
          for arch in amd64 arm64; do
            stage="$RUNNER_TEMP/runtime-$arch"
            mkdir -p "$stage/scripts"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$stage/wb2api" ./cmd/server
            for helper in login credit signin trial activity; do
              output="$helper"
              case "$helper" in
                signin|trial|activity) output="${helper}_bin" ;;
              esac
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags '-s -w' -o "$stage/$output" "./cmd/$helper"
            done
            cp login.sh credit.sh signin.sh trial.sh "$stage/"
            cp scripts/global_region.py scripts/task_common.py scripts/task_runner.py scripts/school_open_day_2026.py scripts/growth_center.py "$stage/scripts/"
            sed -i 's/\r$//' "$stage/"*.sh "$stage/scripts/"*.py
            python3 scripts/runtime_bundle.py --stage "$stage" --version "$version" --arch "$arch" --archive "dist/wb2api-runtime-linux-$arch.tar.gz"
          done
          cd dist
          sha256sum wb2api-runtime-linux-*.tar.gz > SHA256SUMS.txt

      - name: Confirm artifacts will remain private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api --hostname github.com "repos/$GITHUB_REPOSITORY" --jq '.private')" = 'true'

      - name: Save private build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wb2api-runtime-${{ github.sha }}
          path: |
            dist/wb2api-runtime-linux-amd64.tar.gz
            dist/wb2api-runtime-linux-arm64.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
